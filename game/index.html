<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ROOMSHIFT v0.9</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#080d13">
<style>
  /* Layout: one-screen arcade cabinet. HUD strip, fixed-aspect playfield, one progress rail. Deliberately dark-only (single visual world). */
  :root{
    color-scheme:dark;
    --bg:#080d13; --panel:#101923; --line:#253340; --muted:#8ca0ad; --text:#eef6f8;
    --cyan:#78f0df; --gold:#ffd57b; --coral:#ff7e86; --blue:#72c9ff; --violet:#c6a0ff;
    --font-display:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --font-body:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(110% 90% at 50% 0%,#152632 0%,var(--bg) 58%),var(--bg);
    color:var(--text);font-family:var(--font-display);overscroll-behavior:none;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
    display:flex;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .app{width:min(100%,520px);height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px 12px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0}
  .kicker{white-space:nowrap;font-size:10px;letter-spacing:.2em;color:var(--cyan);font-weight:800;text-transform:uppercase}
  h1{margin:0;font-size:clamp(22px,6vw,30px);font-weight:850;letter-spacing:-.06em;line-height:1}
  h1 span{color:var(--cyan)}
  .tagline{margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
  .stats{display:flex;gap:6px}
  .stat{min-width:56px;border:1px solid #283944;background:rgba(16,25,35,.76);border-radius:13px;padding:6px 9px;text-align:center;transition:border-color .2s,background .2s}
  .stat .label{font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:700}
  .stat .value{font-variant-numeric:tabular-nums;font-size:19px;font-weight:800;line-height:1.25}
  .stat.urgent{border-color:rgba(255,126,134,.72);background:rgba(57,21,29,.68)}
  .stat.urgent .value{color:var(--coral);animation:pulse .5s ease-in-out infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.1)}}
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;border-radius:22px;border:1px solid rgba(123,163,184,.16);background:#0a131b;box-shadow:0 18px 55px rgba(0,0,0,.28);outline:none}
  canvas:focus-visible{border-color:var(--cyan)}
  .under{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .hint{font-family:var(--font-body);font-size:12px;color:#a9bbc4;line-height:1.35;min-width:0}
  .hint strong{color:var(--text)}
  .controls{display:flex;gap:6px;flex:1}
  .controls button{flex:1}
  button{font:inherit;color:var(--text);cursor:pointer;border:1px solid #2a3b47;border-radius:12px;background:linear-gradient(180deg,#16232e,#101923);padding:9px 12px;font-size:12px;font-weight:750;touch-action:manipulation}
  button:active{transform:translateY(1px);filter:brightness(1.15)}
  button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  button.primary{color:#071310;background:linear-gradient(180deg,#9af8e9,#61d9ca);border-color:#8beadc}
  .rail{border:1px solid #2c3f4e;background:linear-gradient(110deg,rgba(21,35,49,.92),rgba(16,25,35,.78));border-radius:14px;padding:9px 12px;display:flex;flex-direction:column;gap:7px}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:11px;font-family:var(--font-body)}
  .meta strong{color:var(--text);font-variant-numeric:tabular-nums}
  .track{height:4px;background:#263640;border-radius:9px;overflow:hidden}
  #rankFill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .4s}
  #orbBtn{padding:6px 10px;font-size:11px}
  @media (max-height:700px){.tagline{display:none}.app{gap:7px;padding-block:6px 8px}}
  @media (max-width:380px){.stat{min-width:48px;padding:6px 6px}.stat .value{font-size:17px}button{padding:9px 9px}}
  @media (prefers-reduced-motion:reduce){.stat.urgent .value{animation:none}}
</style>

<div class="app">
  <header>
    <div class="brand">
      <div class="kicker">Arcade · v0.9</div>
      <h1>ROOMSHIFT<span>.</span></h1>
      <div class="tagline">Pull · Release · Sling</div>
    </div>
    <div class="stats">
      <div class="stat" id="timeStat"><div class="label">Time</div><div class="value" id="time">30</div></div>
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="game" tabindex="0" aria-label="ROOMSHIFT playfield. Pull a corner of the room and let go; the wall springs back and can sling the orb into stars. Blue and purple stars add time."></canvas>
  </main>
  <div class="under">
    <div class="controls">
      <button id="soundBtn" aria-label="Toggle sound">Sound on</button>
      <button id="pauseBtn">Pause</button>
      <button id="restartBtn" class="primary">Restart ↻</button>
    </div>
  </div>
  <div class="rail">
    <div class="meta"><span>RANK <strong id="rankName">Rookie</strong></span><span id="rankNext">150 to Contender</span></div>
    <div class="track"><div id="rankFill"></div></div>
    <div class="meta"><span id="rankReward">Next reward: Comet orb</span><button id="orbBtn">Orb: Classic ›</button></div>
  </div>
</div>

<script>
// SIM-BEGIN
// Pure simulation: no DOM, fixed 120 Hz step, seeded RNG, fixed logical playfield (390 x 620 units on every device).
const RS = (() => {
  const FW = 390, FH = 620, STEP = 1 / 120, RUN = 30;
  const REST = [{ x: 52, y: 78 }, { x: 338, y: 92 }, { x: 328, y: 538 }, { x: 46, y: 552 }]; // clockwise on screen
  const K = 170, DAMP = 15;            // corner spring: ~0.4 s return with slight overshoot
  const WALL_CAP = 620;                // softened moving-wall influence for more readable bounces
  const WALL_TRANSFER = 0.45;          // only part of wall velocity is imparted to the orb
  const CHAIN_WIN = 2.8, RUSH = 5, AREA_FLOOR = 0.35, HITSTOP = 0.03, BONUS_LIFE = 4.5, STAR_COUNT = 5;
  const TIERS = {
    gold:   { value: 1, color: '#ffd57b', r: 7, ext: 0 },
    blue:   { value: 2, color: '#72c9ff', r: 8, ext: 1 },
    purple: { value: 3, color: '#c6a0ff', r: 8, ext: 2 },
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  function rng32(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function area(P) { let a = 0; for (let i = 0; i < P.length; i++) { const p = P[i], q = P[(i + 1) % P.length]; a += p.x * q.y - q.x * p.y; } return Math.abs(a / 2); }
  function centroid(P) { return P.reduce((o, p) => ({ x: o.x + p.x / P.length, y: o.y + p.y / P.length }), { x: 0, y: 0 }); }
  // Largest signed distance from pt to any edge line (positive = outside the convex room).
  function maxSigned(P, pt) {
    let m = -Infinity;
    for (let i = 0; i < 4; i++) {
      const a = P[i], b = P[(i + 1) % 4], ex = b.x - a.x, ey = b.y - a.y, l = Math.hypot(ex, ey) || 1;
      m = Math.max(m, (pt.x - a.x) * (ey / l) + (pt.y - a.y) * (-ex / l));
    }
    return m;
  }
  const inside = (P, pt) => maxSigned(P, pt) <= 0;
  const REST_AREA = area(REST), COS_MIN_ANGLE = Math.cos(28 * Math.PI / 180);
  // Room validity: in bounds, strictly convex, no edge shorter than 56, no corner sharper than 28 deg, area >= 35% of rest.
  function validPoly(P) {
    for (const p of P) if (p.x < 8 || p.x > FW - 8 || p.y < 8 || p.y > FH - 8) return false;
    for (let i = 0; i < 4; i++) {
      const a = P[i], b = P[(i + 1) % 4], c = P[(i + 2) % 4];
      const e1x = b.x - a.x, e1y = b.y - a.y, e2x = c.x - b.x, e2y = c.y - b.y;
      const l1 = Math.hypot(e1x, e1y), l2 = Math.hypot(e2x, e2y);
      if (l1 < 56) return false;
      if ((e1x * e2y - e1y * e2x) / (l1 * l2) < 0.03) return false;
      const cosB = ((a.x - b.x) * (c.x - b.x) + (a.y - b.y) * (c.y - b.y)) / (l1 * l2);
      if (cosB > COS_MIN_ANGLE) return false;
    }
    return area(P) >= REST_AREA * AREA_FLOOR;
  }
  const baseSpeed = collected => Math.min(0.65, 0.35 + collected * 0.009) * FW;
  function rollTier(s) { const r = s.rnd(); return r < 0.70 ? 'gold' : r < 0.94 ? 'blue' : 'purple'; }
  function spawn(s, tier, prev) {
    const spec = TIERS[tier], bonus = tier !== 'gold';
    let best = null, bm = -Infinity;
    for (let n = 0; n < 900; n++) {
      const q = { x: FW * (0.06 + s.rnd() * 0.88), y: FH * (0.06 + s.rnd() * 0.88) };
      const sd = maxSigned(REST, q);
      // Keep every collectible comfortably inside the resting room.
      if (sd > -34) continue;
      const bD = dist(q, s.ball); if (bD < 40) continue;
      const oD = s.stars.length ? Math.min(...s.stars.map(t => dist(t, q))) : 1e6;
      const pD = prev ? dist(q, prev) : 1e6;
      const m = Math.min(bD / 130, oD / 55, pD / 60);
      if (m > bm) { bm = m; best = q; }
      if (m >= 1) break;
    }
    const p = best || { x: FW * 0.5, y: FH * 0.3 };
    return { x: p.x, y: p.y, tier, value: spec.value, r: spec.r, color: spec.color, bonus, outside: false,
             life: bonus ? BONUS_LIFE : Infinity, maxLife: BONUS_LIFE, phase: s.rnd() * Math.PI * 2, id: s.nextId++ };
  }
  function create(seed) {
    const s = {
      seed, rnd: rng32(seed), nextId: 1, t: 0, timeLeft: RUN, over: false,
      score: 0, collected: 0, chain: 0, bestChain: 0, lastHit: -99, extended: 0, slings: 0, hitstop: 0, boosted: false,
      corners: REST.map(p => ({ x: p.x, y: p.y, vx: 0, vy: 0 })), grab: -1,
      ball: { x: FW * 0.49, y: FH * 0.5, vx: 0, vy: 0, r: 7 }, stars: [], events: [], timeline: [0],
    };
    const v0 = baseSpeed(0); s.ball.vx = Math.cos(-0.66) * v0; s.ball.vy = Math.sin(-0.66) * v0;
    for (let i = 0; i < STAR_COUNT; i++) s.stars.push(spawn(s, i < 3 ? 'gold' : rollTier(s)));
    return s;
  }
  function moveCorners(s, input) {
    const C = s.corners;
    for (let i = 0; i < 4; i++) {
      const c = C[i], ox = c.x, oy = c.y, grabbed = i === s.grab;
      let nx, ny;
      if (grabbed) {
        const tx = clamp(input.tx, 8, FW - 8), ty = clamp(input.ty, 8, FH - 8);
        nx = c.x + (tx - c.x) * 0.5; ny = c.y + (ty - c.y) * 0.5;
      } else {
        const dx = REST[i].x - c.x, dy = REST[i].y - c.y;
        if (Math.abs(dx) < 0.05 && Math.abs(dy) < 0.05 && Math.hypot(c.vx, c.vy) < 0.5) { c.x = REST[i].x; c.y = REST[i].y; c.vx = c.vy = 0; continue; }
        c.vx += (K * dx - DAMP * c.vx) * STEP; c.vy += (K * dy - DAMP * c.vy) * STEP;
        nx = c.x + c.vx * STEP; ny = c.y + c.vy * STEP;
      }
      const P = C.map(p => ({ x: p.x, y: p.y }));
      const tryAt = t => { P[i].x = ox + (nx - ox) * t; P[i].y = oy + (ny - oy) * t; return validPoly(P); };
      let t = 1;
      if (!tryAt(1)) { let lo = 0, hi = 1; for (let k = 0; k < 12; k++) { const mid = (lo + hi) / 2; if (tryAt(mid)) lo = mid; else hi = mid; } t = lo; }
      c.x = ox + (nx - ox) * t; c.y = oy + (ny - oy) * t;
      const rvx = (c.x - ox) / STEP, rvy = (c.y - oy) / STEP;
      if (grabbed) { c.vx = c.vx * 0.4 + rvx * 0.6; c.vy = c.vy * 0.4 + rvy * 0.6; }
      else if (t < 1) { c.vx = rvx; c.vy = rvy; }
    }
  }
  function moveBall(s) {
    const b = s.ball, C = s.corners;
    b.x += b.vx * STEP; b.y += b.vy * STEP;
    let hit = false, push = 0, hx = 0, hy = 0;
    // Project the orb back inside every edge half-plane. Works even when a fast wall sweeps past the orb in one step.
    for (let it = 0; it < 3; it++) {
      for (let i = 0; i < 4; i++) {
        const a = C[i], c = C[(i + 1) % 4], ex = c.x - a.x, ey = c.y - a.y, len = Math.hypot(ex, ey) || 1;
        const nx = ey / len, ny = -ex / len, sd = (b.x - a.x) * nx + (b.y - a.y) * ny;
        if (sd > -b.r) {
          const u = clamp(((b.x - a.x) * ex + (b.y - a.y) * ey) / (len * len), 0, 1);
          let wvx = (a.vx + (c.vx - a.vx) * u) * WALL_TRANSFER, wvy = (a.vy + (c.vy - a.vy) * u) * WALL_TRANSFER;
          const ws = Math.hypot(wvx, wvy); if (ws > WALL_CAP) { wvx *= WALL_CAP / ws; wvy *= WALL_CAP / ws; }
          b.x -= nx * (sd + b.r + 0.01); b.y -= ny * (sd + b.r + 0.01);
          const rn = (b.vx - wvx) * nx + (b.vy - wvy) * ny;
          if (rn > 0) {
            b.vx -= 2 * rn * nx; b.vy -= 2 * rn * ny; hit = true; hx = b.x + nx * b.r; hy = b.y + ny * b.r;
            push = Math.max(push, -(wvx * nx + wvy * ny));
          }
        }
      }
    }
    if (!inside(C, b)) { const c = centroid(C); b.x = c.x; b.y = c.y; } // last-resort safety, should never trigger
    const target = baseSpeed(s.collected);
    let sp = Math.hypot(b.vx, b.vy); if (sp < 1e-6) { b.vx = target; b.vy = 0; sp = target; }
    let ns = sp < target ? target : target + (sp - target) * Math.exp(-1.5 * STEP);
    ns = Math.min(ns, target * 2.0);
    b.vx *= ns / sp; b.vy *= ns / sp;
    s.boosted = ns > target * 1.3;
    if (hit) {
      if (push > 60 && s.boosted) s.events.push({ type: 'sling', x: hx, y: hy, power: ns / target });
      else s.events.push({ type: 'bounce', x: hx, y: hy, speed: ns });
    }
  }
  function collect(s) {
    const b = s.ball;
    for (let i = s.stars.length - 1; i >= 0; i--) {
      const st = s.stars[i];
      if (dist(b, st) >= b.r + st.r + 4) continue;
      s.chain = s.t - s.lastHit < CHAIN_WIN ? s.chain + 1 : 1; s.lastHit = s.t; s.bestChain = Math.max(s.bestChain, s.chain);
      const mult = Math.min(4, 1 + Math.floor((s.chain - 1) / 3)), rush = s.timeLeft <= RUSH ? 2 : 1, sling = s.boosted;
      const pts = st.value * (sling ? 2 : 1) * mult * rush;
      s.score += pts; s.collected++; if (sling) s.slings++;
      let ext = 0;
      if (st.bonus) { const before = s.timeLeft; s.timeLeft = Math.min(RUN, s.timeLeft + TIERS[st.tier].ext); ext = s.timeLeft - before; s.extended += ext; }
      s.hitstop = HITSTOP;
      s.events.push({ type: 'star', x: st.x, y: st.y, tier: st.tier, color: st.color, pts, mult, rush, sling, ext, chain: s.chain });
      s.stars.splice(i, 1); s.stars.push(spawn(s, rollTier(s), st));
    }
  }
  function step(s, input) {
    if (s.over) return;
    if (s.hitstop > 0) { s.hitstop -= STEP; return; }
    s.t += STEP; s.timeLeft -= STEP;
    if (input.grab !== s.grab) { if (s.grab >= 0) s.events.push({ type: 'release', i: s.grab }); s.grab = input.grab; }
    moveCorners(s, input);
    moveBall(s);
    collect(s);
    if (s.chain > 0 && s.t - s.lastHit >= CHAIN_WIN) { s.chain = 0; s.events.push({ type: 'chainEnd' }); }
    for (let i = s.stars.length - 1; i >= 0; i--) {
      const st = s.stars[i];
      if (st.bonus && (st.life -= STEP) <= 0) { s.events.push({ type: 'expire', x: st.x, y: st.y, color: st.color }); s.stars.splice(i, 1); s.stars.push(spawn(s, rollTier(s), st)); }
    }
    while (s.timeline.length <= Math.floor(s.t)) s.timeline.push(s.score);
    if (s.timeLeft <= 0) { s.timeLeft = 0; s.over = true; s.events.push({ type: 'end' }); }
  }
  return { FW, FH, STEP, RUN, REST, TIERS, CHAIN_WIN, RUSH, create, step, inside, validPoly, baseSpeed };
})();
// SIM-END

(() => {
  const { FW, FH, STEP, RUN, REST, TIERS, CHAIN_WIN, RUSH } = RS;
  const $ = id => document.getElementById(id);
  const canvas = $('game'), ctx = canvas.getContext('2d'), stage = $('stage');
  const timeEl = $('time'), scoreEl = $('score'), bestEl = $('best'), timeStat = $('timeStat');
  const pauseBtn = $('pauseBtn'), restartBtn = $('restartBtn'), soundBtn = $('soundBtn'), orbBtn = $('orbBtn');
  const store = {
    get(k, d) { try { const v = localStorage.getItem('rs9.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('rs9.' + k, JSON.stringify(v)); } catch {} },
  };
  const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } })();
  const TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const FONT = 'ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif';

  // One progression track: lifetime points raise your rank; each rank unlocks one orb.
  const RANKS = [
    { name: 'Rookie', at: 0, orb: 'Classic' }, { name: 'Contender', at: 150, orb: 'Comet' }, { name: 'Ace', at: 400, orb: 'Solar' },
    { name: 'Expert', at: 900, orb: 'Aurora' }, { name: 'Master', at: 2000, orb: 'Violet' }, { name: 'Legend', at: 4500, orb: 'Prism' },
    { name: 'Mythic', at: 9000, orb: 'Nova' },
  ];
  const ORBS = { Classic: '#78f0df', Comet: '#72c9ff', Solar: '#ffd57b', Aurora: '#72f0b4', Violet: '#c5a3ff', Prism: '#f0a8ff', Nova: '#ffb86b' };
  const rankIndex = pts => RANKS.reduce((idx, r, i) => pts >= r.at ? i : idx, 0);

  let best = store.get('best', 0), bestTimeline = store.get('bestTimeline', null), lifetime = store.get('lifetime', 0);
  let orb = store.get('orb', 'Classic'), muted = store.get('muted', false), hintSeen = store.get('hintSeen', false);
  if (!ORBS[orb] || RANKS.findIndex(r => r.orb === orb) > rankIndex(lifetime)) orb = 'Classic';

  let sim, mode = 'play', input = { grab: -1, tx: 0, ty: 0 }, pointerId = null, acc = 0, last = 0, overAt = 0, result = null;
  let particles = [], pops = [], trail = [], shake = 0, flash = 0, lastTick = -1, lastBounceSfx = 0, banner = null;
  let scale = 1, dpr = 1;

  // ---------- audio ----------
  let actx = null, master = null;
  function ensureAudio() {
    if (muted) return;
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination); } catch { actx = null; }
  }
  function tone(f, d, type = 'sine', g = 0.15, f2 = null, delay = 0) {
    if (!actx || muted) return;
    const t = actx.currentTime + delay, o = actx.createOscillator(), a = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    a.gain.setValueAtTime(0.0001, t); a.gain.exponentialRampToValueAtTime(g, t + 0.006); a.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(a); a.connect(master); o.start(t); o.stop(t + d + 0.03);
  }
  const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98];
  const sfx = {
    bounce(speed) { const now = performance.now(); if (now - lastBounceSfx < 45) return; lastBounceSfx = now; tone(160 + speed * 0.25, 0.045, 'triangle', 0.05); },
    star(e) { const f = SCALE[Math.min(e.chain - 1, SCALE.length - 1)]; tone(f, 0.17, 'sine', 0.16); tone(f * 2, 0.1, 'sine', 0.05, null, 0.02); if (e.tier !== 'gold') tone(f * 1.5, 0.22, 'triangle', 0.06, null, 0.05); },
    sling() { tone(150, 0.14, 'square', 0.05, 55); },

  function refreshRail() {

  function drawField() {

  }

      text(`×${m}`, 82, 20, { size: 12, weight: 900, align: 'left', color: m > 1 ? '#ffd57b' : '#8ca0ad' });

    } else text('RESHAPE / REDIRECT', 16, 20, { size: 9, align: 'left', color: 'rgba(171,197,207,.5)', spacing: 2 });
